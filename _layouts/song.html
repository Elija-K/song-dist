<!DOCTYPE html>
{% assign l = site.data.languages | where: "name", page.language | first -%}
<html lang="{{ l.htmlLangTag }}">

<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link href="{{ site.baseurl }}/assets/css/main.css" rel="stylesheet">
</head>

<!-- ########################################## -->
<!-- ## For God so loved this world,         ## -->
<!-- ## that he gave his ONLY begotten Son,  ## -->
<!-- ## that whosoever believeth in him      ## -->
<!-- ## should not perish, but have          ## -->
<!-- ## everlasting life.                    ## -->
<!-- ## John 3:16 KJV                        ## -->
<!-- ########################################## -->

<body>

  
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
   <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  {% include navbar.html -%}
  
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 col-lg-3 d-none d-md-block d-lg-none"></div>
      <div class="col-md-2 col-lg-3 d-none d-lg-block d-print-none mt-2 mt-md-4 sticky-top">
      </div>
      <div class="col-md-8 col-lg-6 mt-2 mt-md-4 text-center">
        
        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
          
          <a class="btn btn-secondary {% unless page.spotify %}disabled{% endunless %}" href="{{ page.spotify }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-spotify" viewBox="0 0 16 16">
              <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.669 11.538a.498.498 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686zm.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858zm.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288z"></path>
            </svg>
            Spotify
          </a>

          <a class="btn btn-secondary {% unless page.youtube %}disabled{% endunless %}" href="{{ page.youtube }}" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-youtube" viewBox="0 0 16 16">
              <path d="M8.051 1.999h.089c.822.003 4.987.033 6.11.335a2.01 2.01 0 0 1 1.415 1.42c.101.38.172.883.22 1.402l.01.104.022.26.008.104c.065.914.073 1.77.074 1.957v.075c-.001.194-.01 1.108-.082 2.06l-.008.105-.009.104c-.05.572-.124 1.14-.235 1.558a2.01 2.01 0 0 1-1.415 1.42c-1.16.312-5.569.334-6.18.335h-.142c-.309 0-1.587-.006-2.927-.052l-.17-.006-.087-.004-.171-.007-.171-.007c-1.11-.049-2.167-.128-2.654-.26a2.01 2.01 0 0 1-1.415-1.419c-.111-.417-.185-.986-.235-1.558L.09 9.82l-.008-.104A31 31 0 0 1 0 7.68v-.123c.002-.215.01-.958.064-1.778l.007-.103.003-.052.008-.104.022-.26.01-.104c.048-.519.119-1.023.22-1.402a2.01 2.01 0 0 1 1.415-1.42c.487-.13 1.544-.21 2.654-.26l.17-.007.172-.006.086-.003.171-.007A100 100 0 0 1 7.858 2zM6.4 5.209v4.818l4.157-2.408z"/>
            </svg>
            YouTube
          </a>

          <div class="btn-group">
            <button onclick="show_text()" class="btn btn-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-fonts" viewBox="0 0 16 16">
                <path d="M12.258 3h-8.51l-.083 2.46h.479c.26-1.544.758-1.783 2.693-1.845l.424-.013v7.827c0 .663-.144.82-1.3.923v.52h4.082v-.52c-1.162-.103-1.306-.26-1.306-.923V3.602l.431.013c1.934.062 2.434.301 2.693 1.846h.479z"/>
              </svg>
              Text
            </button>
            <button onclick="show_chords()" class="btn btn-secondary {% unless page.akkorde %}disabled{% endunless %}">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-music-note-list" viewBox="0 0 16 16">
                <path d="M12 13c0 1.105-1.12 2-2.5 2S7 14.105 7 13s1.12-2 2.5-2 2.5.895 2.5 2"/>
                <path fill-rule="evenodd" d="M12 3v10h-1V3z"/>
                <path d="M11 2.82a1 1 0 0 1 .804-.98l3-.6A1 1 0 0 1 16 2.22V4l-5 1z"/>
                <path fill-rule="evenodd" d="M0 11.5a.5.5 0 0 1 .5-.5H4a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5m0-4A.5.5 0 0 1 .5 7H8a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5m0-4A.5.5 0 0 1 .5 3H8a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5"/>
              </svg>
              Akkorde
            </button>
          </div>
          <button class="btn btn-secondary" onclick="add_favorite()">Add Favorite</button>
          <button class="btn btn-secondary" onclick="del_favorite()">Delete Favorite</button>
        </div>
        <div id="player" style="display: none;text-align: center;"></div> <!-- YT Video/Music Player -->
        <div class="mt-2 mt-md-4" id="songtext">
          <h1>{{ page.title }}</h1>
          {{ content -}}
      </div>
      </div>
    </div>
  </div>
  <iframe src="https://songbuch.justsomeone.ch/songs/{{ page.akkorde }}" id="chords" style="display: none;height: 100vh;" class="mt-2 mt-md-4 ratio"></iframe>
  <p id="UrlGrabber" hidden>{{ page.url }}</p>
  <p id="TitleGrabber" hidden>{{ page.title }}</p>
  <p id="InterpretGrabber" hidden>{{ page.interpret }}</p>
  
  <script defer>
function add_favorite() {
    var songtitle = document.getElementById("TitleGrabber").innerHTML;
    var songinterpret = document.getElementById("InterpretGrabber").innerHTML;
    var songurl = document.getElementById("UrlGrabber").innerHTML;

    jsonString = JSON.stringify({title: songtitle, interpret: songinterpret, url: songurl});

    // Setze das Cookie 'favorites' mit der aktualisierten Favoritenliste
    document.cookie = "fav-{{ page.title | slugify }}=" + encodeURIComponent(jsonString) + ";" + " expires=Mon, 07 May 2029 12:00:00 UTC; path=/";
}

function del_favorite() {
    document.cookie = "fav-{{ page.title | slugify }}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
}

  function show_chords() {
    var element = document.getElementById("chords");
    var text = document.getElementById("songtext");
    if (element.style.display === "none") {
      element.style.display = "block";
      text.style.display = "none";
    }
  }
  function show_text() {
    var element = document.getElementById("chords");
    var text = document.getElementById("songtext");
    if (text.style.display === "none") {
      text.style.display = "block";
      element.style.display = "none";
    }
  }
</script>
</body>
</html>
