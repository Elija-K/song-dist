<!DOCTYPE html>
{% assign l = site.data.languages | where: "name", page.language | first -%}
<html lang="{{ l.htmlLangTag }}">

  <head>
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="{{ site.baseurl }}/assets/css/main.css" rel="stylesheet">
  </head>

  <!-- #################################### -->
  <!-- ## Dont forget that God loves you ## -->
  <!-- ## John 3:16                      ## -->
  <!-- ##################################### -->

  <body>

    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    {% include navbar.html -%}
    
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-2 col-lg-3 d-none d-md-block d-lg-none"></div>
        <div class="col-md-2 col-lg-3 d-none d-lg-block d-print-none mt-2 mt-md-4 sticky-top">
        </div>
        <div class="col-md-8 col-lg-6 mt-2 mt-md-4 text-center">
          
          <div class="d-grid gap-2 d-md-flex justify-content-md-center">
            
            <a class="btn btn-secondary {% unless page.spotify %}disabled{% endunless %}" href="{{ page.spotify }}">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-spotify" viewBox="0 0 16 16">
                <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.669 11.538a.498.498 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686zm.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858zm.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288z"></path>
              </svg>
              Spotify
            </a>

            <a class="btn btn-secondary {% unless page.youtube %}disabled{% endunless %}" href="{{ page.youtube }}" target="_blank">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="bi bi-youtube" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 1.5C4.5 1.5 1.5 2 1.5 4v8c0 2 3 2.5 6.5 2.5S14.5 14 14.5 12V4c0-2-3-2.5-6.5-2.5zM6 5v6l5-3-5-3z"></path>
              </svg>
              YouTube
            </a>

            <div class="btn-group">
              <button onclick="show_text()" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-font-fill" viewBox="0 0 16 16">
                  <path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0zM9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1zM5.057 6h5.886L11 8h-.5c-.18-1.096-.356-1.192-1.694-1.235l-.298-.01v5.09c0 .47.1.582.903.655v.5H6.59v-.5c.799-.073.898-.184.898-.654V6.755l-.293.01C5.856 6.808 5.68 6.905 5.5 8H5l.057-2z"/>
                </svg>
                Text
              </button>
              <button onclick="show_chords()" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-music-fill" viewBox="0 0 16 16">
                  <path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0zM9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1zM11 6.64v1.75l-2 .5v3.61c0 .495-.301.883-.662 1.123C7.974 13.866 7.499 14 7 14c-.5 0-.974-.134-1.338-.377-.36-.24-.662-.628-.662-1.123s.301-.883.662-1.123C6.026 11.134 6.501 11 7 11c.356 0 .7.068 1 .196V6.89a1 1 0 0 1 .757-.97l1-.25A1 1 0 0 1 11 6.64z"></path>
                </svg>
                Akkorde
              </button>
            </div>
            <button class="btn btn-secondary" onclick="add_favorite()">Add Favorite</button>
            <button class="btn btn-secondary" onclick="del_favorite()">Delete Favorite</button>
            <button class="btn btn-secondary disabled" onclick="toggleAudio()">Play/Pause Song</button>
          </div>
        </div>
      </div>
    </div>
    <div id="chords" style="display:none;min-height:60vh;"></div>
    <pre id="songtext" class="mt-2 mt-md-4" style="white-space: pre-wrap;">{{ page.content }}</pre>
    <p id="UrlGrabber" hidden>{{ page.url }}</p>
    <p id="TitleGrabber" hidden>{{ page.title }}</p>
    <p id="InterpretGrabber" hidden>{{ page.interpret }}</p>
    
    <script defer>
    function add_favorite() {
        var songtitle = document.getElementById("TitleGrabber").innerHTML;
        var songinterpret = document.getElementById("InterpretGrabber").innerHTML;
        var songurl = document.getElementById("UrlGrabber").innerHTML;

        jsonString = JSON.stringify({title: songtitle, interpret: songinterpret, url: songurl});

        // Setze das Cookie 'favorites' mit der aktualisierten Favoritenliste
        document.cookie = "fav-{{ page.title | slugify }}=" + encodeURIComponent(jsonString) + ";" + " expires=Mon, 07 May 2029 12:00:00 UTC; path=/";
    }

    function del_favorite() {
        document.cookie = "fav-{{ page.title | slugify }}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }

      function show_chords() {
        var element = document.getElementById("chords");
        var text = document.getElementById("songtext");
        var akkorde = '{{ page.akkorde }}';
        if (getComputedStyle(element).display === "none") {
          element.style.display = "block";
          if (text) text.style.display = "none";
          if (akkorde) {
            if (window._pdfViewerLoading) return;
            window._pdfViewerLoading = true;
            if (window.PDFViewer) {
              PDFViewer.load('https://songbuch.justsomeone.ch/songs/' + akkorde, 'chords').catch(console.error);
            } else {
              var s = document.createElement('script');
              s.src = '{{ site.baseurl }}/assets/js/pdf-viewer.js';
              s.defer = true;
              s.onload = function(){ PDFViewer.load('https://songbuch.justsomeone.ch/songs/' + akkorde, 'chords').catch(console.error); };
              document.body.appendChild(s);
            }
          }
        } else {
          element.style.display = "none";
          if (text) text.style.display = "block";
        }
      }
      function show_text() {
        var element = document.getElementById("chords");
        var text = document.getElementById("songtext");
        if (getComputedStyle(text).display === "none") {
          if (text) text.style.display = "block";
          if (element) element.style.display = "none";
        } else {
          if (text) text.style.display = "none";
          if (element) element.style.display = "block";
        }
      }
    </script>
    <script defer src="{{ site.baseurl }}/assets/js/pdf-viewer.js"></script>
  </body>
</html>
