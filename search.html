<body>
  <div>
    <input class="form-control me-2 mt-4 mb-4" type="text" placeholder="Suchen" id="search-box-js" name="query" oninput="search_text()">
    <div class="container-fluid">
    <button class="btn btn-secondary" onclick="random_song()">Random Song</button>
    <button class="btn btn-secondary" onclick="reset_favorite()">Favoriten löschen</button>
    </div>
  </div>
  <div id="playlist-alway-show">
    <a style="cursor:pointer; color:#0d6efd; text-decoration:underline;" onclick="create_playlist()"><b>Playlist erstellen</b></a> - <a style="cursor:pointer; color:#0d6efd; text-decoration:underline;" onclick="import_playlist()"><b>Playlist importieren</b></a>
  </div>
  <div id="playlists">
    <h5 id="playlist-title">Deine Playlists</h5>
    <div id="playlist-results">
    </div>
  </div>
  <h5 id="favorite-title">Deine Favoriten</h5>
  <div id="favorite-results">
  </div>
  <h5 id="search-title">Songs</h5>
  <div id="search-results">
    
  </div> 
</body>

<script>
  {% assign songs = site.html_pages | where: "dir", "/songs/" %}
  var searchIndex = [
    {% for page in songs %}
      {
        "title" : "{{ page.title | escape }}",
        "interpret" : "{{ page.interpret }}",
        "url" : "{{ site.baseurl }}{{ page.url }}"
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function search_text() {
    var inputElement = document.getElementById("search-box-js");
    var value = inputElement.value;
    search_list(value);
  }
  function search(query) {
    var results = [];
    for (var i = 0; i < searchIndex.length; i++) {
      var post = searchIndex[i];
      if (post.title.toLowerCase().indexOf(query.toLowerCase()) >= 0 ||
          post.interpret.toLowerCase().indexOf(query.toLowerCase()) >= 0) {
        results.push(post);
      }
    }
    return results;
  }
  function search_list(query) {
  // Use the attribute value as needed


  var results = search(query);
  if (!Array.isArray(results) || results.length === 0) {
    document.getElementById('search-results').innerHTML = '';
    document.getElementById("search-title").innerHTML = "Songs (0)";
    return;
  }

  var html = '';
  for (var i = 0; i < results.length; i++) {
    var post = results[i];
    console.log("results (i): " + results[i]);
    html += '<li><a href="' + post.url + '">' + post.title + ' - ' + post.interpret + '</a></li>';
  }
  // Update the search results container with the generated HTML
  document.getElementById('search-results').innerHTML = html;
  document.getElementById("search-title").innerHTML = "Songs " + "(" + results.length + ")";
  }
  function random_song() {
  var songlist = "";
  var randomsong = "";
  var lengtharray = "";
  var thearray = "";
  songlist = search("");
  lengtharray = songlist.length;
  thearray = songlist[Math.floor(Math.random() * lengtharray)];
  randomsong = "https://songbuch.justsomeone.ch/" + thearray.url;
  window.location.href = randomsong;
  }
  function list_playlist() {
    var cookies = document.cookie ? document.cookie.split(';').map(function(c){ return c.trim(); }) : [];
    var playlists = cookies.filter(function(c){ return c.indexOf('=') > -1 && c.split('=')[0].match(/^pl\d+-/); });

    if (playlists.length === 0) {
      document.getElementById("playlists").disabled = true;
      return;
    }
    var playlistHTML = '';
    playlists.forEach(function(cookie) {
      try {
        var cookieName = cookie.split('=')[0];
        var value = cookie.substring(cookie.indexOf('=') + 1);
        if (!value) return;
        var playlistArray = JSON.parse(decodeURIComponent(value));
        if (!Array.isArray(playlistArray)) playlistArray = [playlistArray];
        
        playlistArray.forEach(function(playlist) {
          if (!playlist || !playlist.title) return;
          
          playlistHTML += '<div class="mb-3"><h6><b>' + playlist.title + '</b> - <a style="cursor:pointer; color:#0d6efd; text-decoration:underline;" onclick="deletePlaylist(\'' + cookieName + '\')">Löschen</a> - <a style="cursor:pointer; color:#0d6efd; text-decoration:underline;" onclick="sharePlaylist(\'' + cookieName + '\')">Teilen</a></h6>';
          playlistHTML += '<ul class="list-unstyled ms-3">';
          
          if (Array.isArray(playlist.songs) && playlist.songs.length > 0) {
            playlist.songs.forEach(function(song) {
              playlistHTML += '<li><a href="' + (song.url || '#') + '">' + (song.title || 'Untitled') + ' - ' + (song.artist || '') + '</a></li>';
            });
          } else {
            playlistHTML += '<li class="text-muted">Keine Songs</li>';
          }
          
          playlistHTML += '</ul></div>';
        });
      } catch (e) {
        console.error('Failed to parse playlist cookie:', cookie, e);
      }
    });

    var container = document.getElementById('playlist-results');
    if (container) container.innerHTML = playlistHTML;
  }
  function deletePlaylist(cookieName) {
    document.cookie = cookieName + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    document.href = document.location.href; // Refresh the page to update the playlist list
  }
  function sharePlaylist(cookieName) {
    var cookies = document.cookie ? document.cookie.split(';').map(function(c){ return c.trim(); }) : [];
    var playlistCookie = cookies.find(function(c){ return c.indexOf('=') > -1 && c.split('=')[0] === cookieName; });
    if (!playlistCookie) {
      alert('Playlist nicht gefunden?');
      return;
    }
    var value = playlistCookie.substring(playlistCookie.indexOf('=') + 1);
    if (!value) {
      alert('Playlist hat keinen Inhalt!?');
      return;
    }
    
    var playlistData = decodeURIComponent(value);
    var playlistName = cookieName.replace(/^pl\d+-/, '');
    var fileName = playlistName + '.js-pl';
    
    // Create blob and download
    var blob = new Blob([playlistData], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    alert('Playlist als ' + fileName + ' heruntergeladen.');
  }
  function savePlaylistCookie(playlistName, playlistData) {
    var cookies = document.cookie ? document.cookie.split(';').map(function(c){ return c.trim(); }) : [];
    var existingPlaylists = cookies.filter(function(c){ return c.indexOf('=') > -1 && c.split('=')[0].match(/^pl\d+-/); });

    var nameExists = existingPlaylists.some(function(c) {
      return c.split('=')[0].replace(/^pl\d+-/, '') === playlistName;
    });
    if (nameExists) {
      alert("Es existiert bereits eine Playlist mit diesem Namen!");
      return false;
    }

    var num = existingPlaylists.reduce(function(maxNum, cookie) {
      var match = cookie.split('=')[0].match(/^pl(\d+)-/);
      var currentNum = match ? parseInt(match[1], 10) : 0;
      return currentNum > maxNum ? currentNum : maxNum;
    }, 0) + 1;

    var cookieName = 'pl' + num + '-' + playlistName;
    var payload = playlistData || {
      title: playlistName,
      'created-at': new Date().toISOString(),
      'created-by': 'Benutzer',
      songs: []
    };

    if (!payload.title) payload.title = playlistName;
    if (!payload['created-at']) payload['created-at'] = new Date().toISOString();
    if (!payload['created-by']) payload['created-by'] = 'Benutzer';
    if (!Array.isArray(payload.songs)) payload.songs = [];

    document.cookie = cookieName + '=' + encodeURIComponent(JSON.stringify(payload)) + '; path=/;';
    return true;
  }
  function create_playlist() {
    var playlistName = prompt("Gib deiner Playlist DEN Namen:");
    if (!playlistName) {
      alert("Playlist-Name darf nicht leer sein!");
      return;
    }
    savePlaylistCookie(playlistName);
    list_playlist();
  }
  function import_playlist() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.js-pl,application/json';
    
    input.onchange = function(event) {
      var file = event.target.files[0];
      if (!file) return;
      
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var content = e.target.result;
          var playlistData = JSON.parse(content);
          if (!playlistData || !playlistData.title) {
            alert('Ungültiges Playlist-Format!');
            return;
          }
          
          var playlistName = playlistData.title;
          if (savePlaylistCookie(playlistName, playlistData)) {
            list_playlist();
          }
        } catch (err) {
          console.error('Fehler beim Importieren der Playlist:', err);
          alert('Fehler beim Importieren der Playlist. Stelle sicher, dass die Datei im richtigen Format ist.');
        }
      };
      
      reader.readAsText(file);
    };
    
    input.click();
  }
  function list_favorite() {
    // Read all cookies whose name starts with 'fav-' and parse each value as a single favorite song
    var cookies = document.cookie ? document.cookie.split(';').map(function(c){ return c.trim(); }) : [];
    var favCookies = cookies.filter(function(c){ return c.indexOf('=') > -1 && c.split('=')[0].startsWith('fav-'); });

    if (favCookies.length === 0) {
      document.getElementById("favorite-results").innerHTML = "Du hast keine Favoriten :(";
      document.getElementById("favorite-title").innerHTML = "Deine Favoriten (0)";
      return;
    }

    var favoriteSongs = [];
    favCookies.forEach(function(cookie) {
      try {
        var value = cookie.substring(cookie.indexOf('=') + 1);
        if (!value) return;
        var song = JSON.parse(decodeURIComponent(value));
        if (song && song.url) favoriteSongs.push(song);
      } catch (e) {
        console.error('Failed to parse favorite cookie:', cookie, e);
      }
    });

    if (favoriteSongs.length === 0) {
      document.getElementById("favorite-results").innerHTML = "Du hast keine Favoriten :(";
      document.getElementById("favorite-title").innerHTML = "Deine Favoriten (0)";
      return;
    }

    var searchResultHTML = '';
    favoriteSongs.forEach(function(song) {
      searchResultHTML += '<li><a href="' + song.url + '">' + song.title + ' - ' + song.interpret + '</a></li>';
    });

    var searchFavoriteList = document.getElementById('favorite-results');
    var titleFavoriteList = document.getElementById("favorite-title");
    if (searchFavoriteList) searchFavoriteList.innerHTML = searchResultHTML;
    if (titleFavoriteList) titleFavoriteList.innerHTML = "Deine Favoriten " + "(" + favoriteSongs.length + ")";
  }
  function reset_favorite() {
  // Clear UI
  var favResults = document.getElementById("favorite-results");
  var favTitle = document.getElementById("favorite-title");
  if (favResults) favResults.innerHTML = "Du hast keine Favoriten :(";
  if (favTitle) favTitle.innerHTML = "Deine Favoriten (0)";

  // Delete all cookies whose name starts with 'fav-'
  var cookies = document.cookie ? document.cookie.split(';').map(function(c){ return c.trim(); }) : [];
  cookies.forEach(function(c){
    var name = c.split('=')[0];
    if (name && name.startsWith('fav-')) {
      document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    }
  });
  }

  search_list("");
  list_favorite();
  list_playlist();
</script>
